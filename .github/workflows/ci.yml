name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Security Audit
      run: npm audit --audit-level=high
      
    - name: Run Tests
      run: npm test
      
    - name: Verify Preflight
      run: node scripts/preflight-production.js
      env:
        CI: true
